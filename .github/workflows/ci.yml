name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: my-app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
        env:
          BACKEND_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_STACK_PROJECT_ID: 12345678-1234-4234-8234-123456789012
          NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY: pck_test_dummy
          STACK_SECRET_SERVER_KEY: ssk_test_dummy
